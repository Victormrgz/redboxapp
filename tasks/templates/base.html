<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django CRUD Application</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis. com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?
family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200.. 800&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css">

</head>

<body>
    <aside class="sidebar">
        <ul class="sidebar__list">

            <li class="sidebar__element">

                <img src="{% static 'monogram.svg' %}" class="sidebar__icon sidebar__icon--logo">

                <div class="sidebar__hide">
                    <img src="{% static 'logoblanco.svg' %}" class="sidebar__logo">
                </div>

            </li>

            <li>
                <a href="/dashboard" class="sidebar__element">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        class="sidebar__icon">
                        <path
                            d="M3 13h1v7c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-7h1a1 1 0 0 0 .707-1.707l-9-9a.999.999 0 0 0-1.414 0l-9 9A1 1 0 0 0 3 13zm9-8.586 6 6V15l.001 5H6v-9.585l6-6.001z">
                        </path>
                        <path
                            d="M12 17c2.206 0 4-1.794 4-4s-1.794-4-4-4-4 1.794-4 4 1.794 4 4 4zm0-6c1.103 0 2 .897 2 2s-.897 2-2 2-2-.897-2-2 .897-2 2-2z">
                        </path>
                    </svg>

                    <div class="sidebar__hide">
                        <p class="sidebar__text">Dashboard</p>
                    </div>
                </a>
            </li>

            <li>
                <a href="/classes" class="sidebar__element">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                        viewBox="0 0 24 24" class="sidebar__icon">
                        <path
                            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2M5 19V5h14v14z">
                        </path>
                        <path d="M7 7h2v2H7zM11 7h6v2h-6zM7 11h2v2H7zM11 11h6v2h-6zM7 15h2v2H7zM11 15h6v2h-6z"></path>
                    </svg>

                    <div class="sidebar__hide">
                        <p class="sidebar__text">Clases</p>
                    </div>
                </a>
            </li>

            <li>
                <a href="/myreservations" class="sidebar__element">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                        viewBox="0 0 24 24" class="sidebar__icon">
                        <path d="M7 11H17V13H7z"></path>
                        <path d="M7 15H14V17H7z"></path>
                        <path
                            d="m19,4h-2v-2h-2v2h-6v-2h-2v2h-2c-1.1,0-2,.9-2,2v14c0,1.1.9,2,2,2h14c1.1,0,2-.9,2-2V6c0-1.1-.9-2-2-2ZM5,20v-12h14v-2,14s-14,0-14,0Z">
                        </path>
                    </svg>

                    <div class="sidebar__hide">
                        <p class="sidebar__text">Mis Reservaciones</p>
                    </div>
                </a>
            </li>

            <li>
                <a href="/myresults" class="sidebar__element">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                        viewBox="0 0 24 24" class="sidebar__icon">
                        <path d="m3,5v6h2v-6h14v14h-6v2h6c1.1,0,2-.9,2-2V5c0-1.1-.9-2-2-2H5c-1.1,0-2,.9-2,2Z"></path>
                        <path d="M6.71 18.71 12.21 13.21 15 16 15 9 8 9 10.79 11.79 5.29 17.29 6.71 18.71z"></path>
                    </svg>

                    <div class="sidebar__hide">
                        <p class="sidebar__text">Mis Resultados</p>
                    </div>
                </a>
            </li>

            <a href="{% url 'signout' %}" class="sidebar__element sidebar__element--logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"
                    class="sidebar__icon">
                    <path d="M16 13v-2H7V8l-5 4 5 4v-3z"></path>
                    <path d="M20 3H10v2h10v14H10v2h10c1.103 0 2-.897 2-2V5c0-1.103-.897-2-2-2z"></path>
                </svg>
                <div class="sidebar__hide">
                    <p class="sidebar__text">Logout</p>
                </div>
            </a>

        </ul>

    </aside>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    {% block scripts %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const dateInput = document.getElementById('id_date');
            const timeInput = document.getElementById('id_time_slot');
            const viewBtn = document.getElementById('ver-reservas-btn');

            function toggleViewButton() {
                if (dateInput.value && timeInput.value) {
                    viewBtn.style.display = 'inline-block';
                } else {
                    viewBtn.style.display = 'none';
                }
            }

            dateInput.addEventListener('change', toggleViewButton);
            timeInput.addEventListener('change', toggleViewButton);
            toggleViewButton(); // Ejecutar al cargar
        });
    </script>
    {% endblock %}
</body>
