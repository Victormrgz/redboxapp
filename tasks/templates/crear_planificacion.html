{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="dashboard-header">
    <div class="mt-5">
        <h2 class="section-title section-title--planificacion">Crear planificación</h2>
        <p class="section-description">Define el contenido del entrenamiento para un día específico.</p>
    </div>

    <div class="planificacion-form-card">
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_fecha">Fecha:</label>
                {{ form.fecha }}
            </div>

            <div class="form-group">
                <label for="id_contenido">Contenido:</label>
                <textarea name="{{ form.contenido.name }}" class="input-field" rows="9"
                    placeholder="Descripción opcional">{{ form.contenido.value|default_if_none:'' }}</textarea>
            </div>

            <button type="submit" class="btn btn-danger">
                {% if planificacion %}Actualizar{% else %}Guardar{% endif %} planificación
            </button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const fechaInput = document.getElementById('id_fecha');
        fechaInput.addEventListener('change', function () {
            const selectedDate = this.value;
            if (selectedDate) {
                window.location.href = `?fecha=${selectedDate}`;
            }
        });
    });
</script>

{% endblock %}
